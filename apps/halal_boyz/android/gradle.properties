org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Project sits on A:\ while the pub cache sits on C:\. The Kotlin incremental
# compiler cannot build relative paths across different drive roots
# ("this and base files have different roots"), which breaks its cache closing
# and makes every build fall back with huge daemon stack traces.
# Disable Kotlin incremental compilation until pub cache and project share a drive.
kotlin.incremental=false

