name: halal_boyz
description: "Config-driven client app generated by the Carnama UI Factory."
publish_to: 'none'
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  core:
    path: ../../packages/core
  core_ui:
    path: ../../packages/core_ui

  # ARCH-1/ARCH-2: the shell imports the REAL screens/router/config and the
  # SHARED init (initCarnamaApp in app_bootstrap.dart) from the labs package
  # (core_app) — there are no local placeholder features/ or l10n/.
  labs:
    path: ../../core_app

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Test-only seam for the GDPR consent chain (kGdprAnalyticsConsentKey):
  # the REAL home screen fires GdprConsentDialog.showIfNeeded on first land;
  # widget tests mock the prefs store (shared_preferences is already a
  # transitive runtime dependency of `labs` — declared here for the direct
  # test import).
  shared_preferences: any
  # Q2 (visual pack full-screen captures): the cart/checkout captures pump the
  # REAL labs screens, whose golden-proven recipe (core_app checkout/cart
  # goldens) needs a fake Firestore + mocked Firebase core channels. Test-only
  # — never linked into the shipped bundle; versions are workspace-pinned
  # (same constraints core_app already declares, so no lockfile drift).
  fake_cloud_firestore: 4.2.0
  firebase_core_platform_interface: any

flutter:
  uses-material-design: true
  assets:
    - assets/client_config.json
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
