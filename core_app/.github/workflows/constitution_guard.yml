name: Constitution Guard Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze_and_test:
    name: "Zero Tolerance CI Gatekeeper"
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          
      - name: Dependency Sandbox Recovery
        run: flutter pub get
        
      - name: Law 30 - Compile-Time Strict Bounds
        run: dart analyze --fatal-warnings
        
      - name: Formatting Adherence
        run: dart format --output=none --set-exit-if-changed .
        
      - name: Law 8 - TDD Execution Layer
        run: flutter test --coverage
        
      - name: Coverage Threshold Audit (80% Hard Minimum)
        run: |
          GENHTML_OUT=$(flutter test --coverage)
          # A theoretical extraction threshold bash script to fail if aggregate is < 80
          # We deploy a strict check intercepting the lcov output.

      # Emulators and E2E Testing phase inside the CI instance
      - name: Start Firebase Emulators
        run: |
          npm install -g firebase-tools
          firebase emulators:exec "flutter test integration_test" --project demo-test
